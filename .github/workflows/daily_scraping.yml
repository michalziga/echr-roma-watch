name: Daily HUDOC Scrape

on:
  schedule:
    - cron: "0 7 * * *"   # every day at 07:00 UTC
  workflow_dispatch:        # manual trigger from GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit updated data back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Step 1 — Collect new cases
        run: python scraper/step1_collect.py

      - name: Step 2 — Fetch full text
        run: python scraper/step2_fulltext.py

      - name: Step 3 — Filter for Roma relevance
        run: python scraper/step3_filter.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Step 4 — Summarize Roma cases
        run: python scraper/step4_summarize.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUMMARIZE_ALL: "true"

      - name: Build index
        run: python scraper/build_index.py

      - name: Step 5 — Notify new cases via Telegram
        run: python scraper/step5_notify.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scraped_cases.json data/ summaries/ summaries.json summaries.json.gz notified_cases.json
          git diff --cached --quiet || git commit -m "chore: update ECHR Roma cases [$(date +'%Y-%m-%d')]"
          git push
